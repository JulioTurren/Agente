<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymApp - Nutricion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav th:replace="~{fragments :: navbar}"></nav>

    <div class="main-content">
        <div class="container py-4">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-1"><i class="fas fa-utensils me-2 text-primary"></i>Nutricion</h2>
                    <p class="text-muted mb-0">Registro de comidas del dia</p>
                </div>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addFoodModal">
                    <i class="fas fa-plus me-1"></i>Registrar Comida
                </button>
            </div>

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                <i class="fas fa-check-circle me-2"></i><span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-icon" style="background-color: #e74c3c15; color: #e74c3c">
                            <i class="fas fa-fire"></i>
                        </div>
                        <div class="stat-info">
                            <h3 th:text="${summary.caloriasTotal()}">0</h3>
                            <p>Calorias Hoy</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-icon" style="background-color: #3498db15; color: #3498db">
                            <i class="fas fa-drumstick-bite"></i>
                        </div>
                        <div class="stat-info">
                            <h3 th:text="${#numbers.formatDecimal(summary.proteinas(), 1, 1)} + 'g'">0g</h3>
                            <p>Proteinas</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-icon" style="background-color: #f39c1215; color: #f39c12">
                            <i class="fas fa-bread-slice"></i>
                        </div>
                        <div class="stat-info">
                            <h3 th:text="${#numbers.formatDecimal(summary.carbohidratos(), 1, 1)} + 'g'">0g</h3>
                            <p>Carbohidratos</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-icon" style="background-color: #2ecc7115; color: #2ecc71">
                            <i class="fas fa-cheese"></i>
                        </div>
                        <div class="stat-info">
                            <h3 th:text="${#numbers.formatDecimal(summary.grasas(), 1, 1)} + 'g'">0g</h3>
                            <p>Grasas</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <div class="stat-card">
                        <div class="stat-icon" style="background-color: #9b59b615; color: #9b59b6">
                            <i class="fas fa-fire-flame-curved"></i>
                        </div>
                        <div class="stat-info">
                            <h3 th:text="${caloriasQuemadas} + ' cal'">0 cal</h3>
                            <p>Promedio Quemado por Entreno</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="stat-card">
                        <div class="stat-icon" style="background-color: #1abc9c15; color: #1abc9c">
                            <i class="fas fa-calendar-week"></i>
                        </div>
                        <div class="stat-info">
                            <h3 th:text="${summary.caloriasSemana()} + ' cal'">0 cal</h3>
                            <p>Calorias Esta Semana</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold"><i class="fas fa-list me-2"></i>Comidas del Dia</h5>
                    <form th:action="@{/nutrition}" method="get" class="d-flex gap-2">
                        <input type="date" class="form-control form-control-sm" name="fecha"
                               th:value="${fechaActual}">
                        <button type="submit" class="btn btn-sm btn-primary">Ver</button>
                    </form>
                </div>
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(entries)}" class="text-center py-4">
                        <i class="fas fa-utensils fa-3x text-muted mb-3"></i>
                        <p class="text-muted">No has registrado comidas este dia</p>
                    </div>
                    <div th:if="${!#lists.isEmpty(entries)}">
                        <div class="food-entry" th:each="entry : ${entries}">
                            <div class="food-icon" th:each="cat : ${categorias}"
                                 th:if="${cat.name() == entry.categoria}"
                                 th:style="'background-color:' + ${cat.color} + '15; color:' + ${cat.color}">
                                <i th:class="'fas ' + ${cat.icon}"></i>
                            </div>
                            <div class="food-info">
                                <h6 class="mb-0" th:text="${entry.nombre}">Comida</h6>
                                <small class="text-muted" th:if="${entry.categoria != null}" th:text="${entry.categoria}">Cat</small>
                            </div>
                            <div class="food-macros">
                                <span class="macro-badge" th:if="${entry.proteinas != null}">
                                    P: <span th:text="${#numbers.formatDecimal(entry.proteinas, 1, 0)}">0</span>g
                                </span>
                                <span class="macro-badge" th:if="${entry.carbohidratos != null}">
                                    C: <span th:text="${#numbers.formatDecimal(entry.carbohidratos, 1, 0)}">0</span>g
                                </span>
                                <span class="macro-badge" th:if="${entry.grasas != null}">
                                    G: <span th:text="${#numbers.formatDecimal(entry.grasas, 1, 0)}">0</span>g
                                </span>
                            </div>
                            <div class="food-cal">
                                <span th:text="${entry.calorias}">0</span> cal
                            </div>
                            <form th:action="@{/nutrition/delete/{id}(id=${entry.id})}" method="post">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addFoodModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold"><i class="fas fa-plus-circle me-2 text-primary"></i>Registrar Comida</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/nutrition/add}" method="post">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre de la comida</label>
                            <input type="text" class="form-control" name="nombre" placeholder="Ej: Pechuga de pollo con arroz" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Categoria</label>
                            <select class="form-select" name="categoria">
                                <option th:each="cat : ${categorias}" th:value="${cat.name()}" th:text="${cat.displayName}"></option>
                            </select>
                        </div>
                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label fw-semibold">Calorias</label>
                                <input type="number" class="form-control" name="calorias" placeholder="kcal" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-semibold">Gramos</label>
                                <input type="number" class="form-control" name="gramos" step="0.1" placeholder="g">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-4">
                                <label class="form-label fw-semibold">Proteinas</label>
                                <input type="number" class="form-control" name="proteinas" step="0.1" placeholder="g">
                            </div>
                            <div class="col-4">
                                <label class="form-label fw-semibold">Carbohidratos</label>
                                <input type="number" class="form-control" name="carbohidratos" step="0.1" placeholder="g">
                            </div>
                            <div class="col-4">
                                <label class="form-label fw-semibold">Grasas</label>
                                <input type="number" class="form-control" name="grasas" step="0.1" placeholder="g">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-check me-1"></i>Registrar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
