<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymApp - Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card text-center">
            <div class="auth-logo" style="background: linear-gradient(135deg, #e74c3c, #c0392b)">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h2 class="fw-bold mb-3">Algo salio mal</h2>
            <p class="text-muted mb-4" th:text="${errorMessage}">Error desconocido</p>
            <a th:href="@{/dashboard}" class="btn btn-primary">
                <i class="fas fa-home me-1"></i>Volver al Dashboard
            </a>
        </div>
    </div>
</body>
</html>
