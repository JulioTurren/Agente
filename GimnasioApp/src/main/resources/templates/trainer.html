<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymApp - Entrenador Virtual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .chat-container {
            max-width: 700px;
            margin: 0 auto;
        }
        .chat-header {
            background: linear-gradient(135deg, #e91e63, #c2185b);
            color: white;
            border-radius: var(--radius-md) var(--radius-md) 0 0;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .chat-avatar {
            width: 48px;
            height: 48px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }
        .chat-messages {
            background: #f8f9fa;
            min-height: 400px;
            max-height: 500px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.trainer {
            background: white;
            color: var(--text-primary);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .message.user {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message-meta {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 4px;
        }
        .chat-input-area {
            background: white;
            border-top: 1px solid var(--border-color);
            border-radius: 0 0 var(--radius-md) var(--radius-md);
            padding: 16px 20px;
        }
        .chat-input-area form {
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            border: 2px solid var(--border-color);
            border-radius: 24px;
            padding: 10px 20px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input-area input:focus {
            border-color: var(--primary);
        }
        .chat-input-area button {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .chat-input-area button:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
        }
        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 0 20px 12px;
            background: white;
        }
        .quick-btn {
            padding: 4px 12px;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            text-decoration: none;
        }
        .quick-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(108,92,231,0.05);
        }
        .trainer-welcome {
            text-align: center;
            padding: 40px 20px;
        }
        .trainer-welcome-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #e91e63, #c2185b);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            color: white;
            font-size: 36px;
        }
    </style>
</head>
<body>
    <nav th:replace="~{fragments :: navbar}"></nav>

    <div class="main-content">
        <div class="container py-4">

            <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm mb-3">
                <i class="fas fa-arrow-left me-1"></i>Volver
            </a>

            <div class="chat-container">
                <div class="chat-header">
                    <div class="chat-avatar">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div>
                        <h5 class="mb-0 fw-bold">Entrenador Virtual</h5>
                        <small style="opacity: 0.8">Siempre disponible para ti</small>
                    </div>
                    <div class="ms-auto">
                        <span class="badge" style="background: rgba(255,255,255,0.2)">
                            <span th:text="${messageCount}">0</span> mensajes
                        </span>
                    </div>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <div th:if="${#lists.isEmpty(messages)}" class="trainer-welcome">
                        <div class="trainer-welcome-icon">
                            <i class="fas fa-dumbbell"></i>
                        </div>
                        <h4 class="fw-bold">Hola <span th:text="${user.name}">Usuario</span>!</h4>
                        <p class="text-muted">Soy tu entrenador virtual. Puedo ayudarte con:</p>
                        <div class="d-flex flex-wrap justify-content-center gap-2 mt-3">
                            <span class="badge bg-light text-dark"><i class="fas fa-dumbbell me-1"></i>Rutinas</span>
                            <span class="badge bg-light text-dark"><i class="fas fa-utensils me-1"></i>Nutricion</span>
                            <span class="badge bg-light text-dark"><i class="fas fa-bullseye me-1"></i>Objetivos</span>
                            <span class="badge bg-light text-dark"><i class="fas fa-lightbulb me-1"></i>Consejos</span>
                        </div>
                    </div>

                    <div th:each="msg : ${messages}" th:class="'message ' + ${msg.remitente}">
                        <div th:text="${msg.contenido}">Mensaje</div>
                        <div class="message-meta" th:text="${#temporals.format(msg.createdAt, 'HH:mm')}">12:00</div>
                    </div>
                </div>

                <div class="quick-actions" th:if="${#lists.isEmpty(messages)}">
                    <a class="quick-btn" href="#" onclick="sendQuick('Hola, necesito ayuda con mi rutina')">Rutina</a>
                    <a class="quick-btn" href="#" onclick="sendQuick('Quiero perder peso, que me recomiendas?')">Perder peso</a>
                    <a class="quick-btn" href="#" onclick="sendQuick('Quiero ganar masa muscular')">Ganar masa</a>
                    <a class="quick-btn" href="#" onclick="sendQuick('Dame un consejo fitness')">Consejo</a>
                </div>

                <div class="chat-input-area">
                    <form th:action="@{/trainer/send}" method="post">
                        <input type="text" name="contenido" placeholder="Escribe tu mensaje..."
                               autocomplete="off" required id="msgInput">
                        <button type="submit"><i class="fas fa-paper-plane"></i></button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function sendQuick(text) {
            document.getElementById('msgInput').value = text;
            document.getElementById('msgInput').closest('form').submit();
        }
        var chat = document.getElementById('chatMessages');
        chat.scrollTop = chat.scrollHeight;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
