<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
                <i class="fas fa-dumbbell me-2"></i>GymApp
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav me-auto">
                    <a class="nav-link" th:href="@{/dashboard}"><i class="fas fa-home me-1"></i>Inicio</a>
                    <a class="nav-link" th:href="@{/membresia}"><i class="fas fa-crown me-1"></i>Membresia</a>
                    <a class="nav-link" th:if="${user != null and user.membresia != null and user.membresia.getTipo() != null and user.membresia.getTipo().name() != 'FREE'}"
                       th:href="@{/nutrition}"><i class="fas fa-utensils me-1"></i>Nutricion</a>
                    <a class="nav-link" th:if="${user != null and user.membresia != null and user.membresia.getTipo() != null and user.membresia.getTipo().name() == 'PREMIUM'}"
                       th:href="@{/trainer}"><i class="fas fa-robot me-1"></i>Entrenador</a>
                </div>
                <div class="navbar-nav">
                    <span class="navbar-text me-3" th:if="${user != null}">
                        <i class="fas fa-user-circle me-1"></i>
                        <span th:text="${user.name}">Usuario</span>
                        <span th:if="${user.membresia != null and user.membresia.getTipo() != null}" class="badge ms-1"
                              th:style="'background-color:' + ${user.membresia.getTipo().getColor()} + '; font-size: 10px'"
                              th:text="${user.membresia.getTipo().getDisplayName()}">Free</span>
                    </span>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm">
                            <i class="fas fa-sign-out-alt"></i> Salir
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <div th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </div>
</body>
</html>
