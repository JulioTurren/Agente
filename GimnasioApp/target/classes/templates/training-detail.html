<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${training.name} + ' - GymApp'">Entrenamiento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <nav th:replace="~{fragments :: navbar}"></nav>

    <div class="main-content">
        <div class="container py-4">

            <div class="mb-4">
                <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm mb-3">
                    <i class="fas fa-arrow-left me-1"></i>Volver
                </a>

                <div class="detail-header" th:style="'background: linear-gradient(135deg, ' + ${training.category.color} + '22, ' + ${training.category.color} + '11)'">
                    <div class="detail-icon" th:style="'background-color:' + ${training.category.color}">
                        <i th:class="'fas ' + ${training.category.icon} + ' fa-2x'"></i>
                    </div>
                    <div class="detail-info">
                        <h2 class="fw-bold mb-1" th:text="${training.name}">Nombre</h2>
                        <p class="text-muted mb-2" th:text="${training.description != null} ? ${training.description} : ''">Desc</p>
                        <div class="detail-meta">
                            <span class="badge" th:style="'background-color:' + ${training.category.color}">
                                <span th:text="${training.category.displayName}">Categoria</span>
                            </span>
                            <span class="meta-item">
                                <i class="fas fa-calendar me-1"></i>
                                <span th:text="${training.dateCreated}">Fecha</span>
                            </span>
                            <span class="meta-item" th:if="${training.totalSets != null}">
                                <i class="fas fa-layer-group me-1"></i>
                                <span th:text="${training.totalSets}">0</span> series totales
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fas fa-check-circle me-2"></i>
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-bold mb-0">
                    <i class="fas fa-list me-2 text-primary"></i>Ejercicios
                </h4>
                <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addExerciseModal">
                    <i class="fas fa-plus me-1"></i>Agregar
                </button>
            </div>

            <div th:if="${#lists.isEmpty(exercises)}" class="empty-state text-center py-4 mb-4">
                <div class="empty-icon small mb-2">
                    <i class="fas fa-clipboard-list"></i>
                </div>
                <h5 class="text-muted">No hay ejercicios aun</h5>
                <p class="text-muted small">Agrega ejercicios a este entrenamiento</p>
            </div>

            <div th:if="${!#lists.isEmpty(exercises)}" class="exercise-list mb-4">
                <div class="exercise-card" th:each="exercise, iter : ${exercises}">
                    <div class="exercise-number" th:text="${iter.index + 1}">1</div>
                    <div class="exercise-info">
                        <h6 class="exercise-name mb-1" th:text="${exercise.name}">Ejercicio</h6>
                        <p class="exercise-muscle text-muted mb-1" th:if="${exercise.muscleGroup != null}"
                           th:text="${exercise.muscleGroup}">Musculo</p>
                        <div class="exercise-details">
                            <span class="detail-badge" th:if="${exercise.sets != null}">
                                <span th:text="${exercise.sets}">0</span> x
                                <span th:text="${exercise.reps != null} ? ${exercise.reps} : '-'">0</span>
                            </span>
                            <span class="detail-badge" th:if="${exercise.weight != null}">
                                <i class="fas fa-weight-hanging me-1"></i>
                                <span th:text="${exercise.weight}">0</span>
                                <span th:text="${exercise.unit != null} ? ${exercise.unit} : 'kg'">kg</span>
                            </span>
                        </div>
                    </div>
                    <form th:action="@{/dashboard/training/{trainingId}/delete-exercise/{exerciseId}(trainingId=${training.id}, exerciseId=${exercise.id})}"
                          method="post" onsubmit="return confirm('Eliminar ejercicio?')">
                        <button type="submit" class="btn btn-sm btn-outline-danger">
                            <i class="fas fa-times"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addExerciseModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">
                        <i class="fas fa-plus-circle me-2 text-primary"></i>Agregar Ejercicio
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/dashboard/training/{id}/add-exercise(id=${training.id})}" method="post">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre del ejercicio</label>
                            <input type="text" class="form-control" name="name" placeholder="Ej: Press de Banca" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Grupo muscular</label>
                            <input type="text" class="form-control" name="muscleGroup" placeholder="Ej: Pecho">
                        </div>
                        <div class="row mb-3">
                            <div class="col-4">
                                <label class="form-label fw-semibold">Series</label>
                                <input type="number" class="form-control" name="sets" value="3" min="1">
                            </div>
                            <div class="col-4">
                                <label class="form-label fw-semibold">Reps</label>
                                <input type="number" class="form-control" name="reps" value="10" min="1">
                            </div>
                            <div class="col-4">
                                <label class="form-label fw-semibold">Peso</label>
                                <input type="number" class="form-control" name="weight" step="0.5" min="0">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Unidad</label>
                            <select class="form-select" name="unit">
                                <option value="kg">kg</option>
                                <option value="lbs">lbs</option>
                                <option value="bodyweight">Peso corporal</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Notas</label>
                            <textarea class="form-control" name="notes" rows="2" placeholder="Notas opcionales..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-check me-1"></i>Agregar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
